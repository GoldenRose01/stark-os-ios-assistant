name: DoomAi
options:
  bundleIdPrefix: com.latveria
  deploymentTarget:
    iOS: "16.0"
targets:
  DoomAi:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StarkOSApp.swift
      - path: SiriIntents
      - path: Engine
      - path: UI
      - path: Assets.xcassets
      - path: LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.latveria.doomai
        PRODUCT_NAME: DoomAi
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
