name: StarkOS
options:
  bundleIdPrefix: com.starkindustries
  deploymentTarget:
    iOS: "16.0"
targets:
  StarkOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StarkOSApp.swift
      - path: SiriIntents
      - path: Engine
      - path: UI
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starkindustries.jarvisedith
        PRODUCT_NAME: StarkOS
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
