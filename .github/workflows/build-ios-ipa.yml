name: Build Native DoomAi iOS App (.ipa) for Windows Sideload

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Compila DoomAi.ipa su Cloud macOS (Zero-Mac)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Genera Progetto Xcode (DoomAi.xcodeproj)
        working-directory: ios-native
        run: xcodegen generate

      - name: Compila App Nativa iOS DoomAi (Full-Screen iPhone 16 Pro Max + Gold Mask Icon)
        working-directory: ios-native
        run: |
          xcodebuild clean build \
            -project DoomAi.xcodeproj \
            -scheme DoomAi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Crea Pacchetto Installabile DoomAi-iOS.ipa
        working-directory: ios-native
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DoomAi.app Payload/
          zip -r9 DoomAi-iOS.ipa Payload

      - name: Carica Artifact DoomAi-iOS.ipa (Scaricabile su Windows)
        uses: actions/upload-artifact@v4
        with:
          name: DoomAi-iOS-IPA
          path: ios-native/DoomAi-iOS.ipa
          retention-days: 30
